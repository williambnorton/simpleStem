<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b3541e"/>
    </marker>
  </defs>
  <style>
    .callout{font-size:13px;fill:#333}
    .lead{stroke:#b3541e;stroke-width:1.6;fill:none;marker-end:url(#ar)}
    .btn{fill:#f4f4f6;stroke:#9aa0a6;rx:4}
    .btnG{fill:#37b26c;stroke:#2c8f57;rx:4}
    .btnY{fill:#f2c14e;stroke:#c99b2e;rx:4}
    .lbl{font-size:11px;fill:#222;text-anchor:middle;font-weight:bold}
    .lblW{font-size:11px;fill:#fff;text-anchor:middle;font-weight:bold}
  </style>

  <rect x="270" y="20" width="200" height="520" fill="#fbfaf7" stroke="#c9c4b8" rx="10"/>

  <rect class="btnY" x="352" y="32" width="36" height="20"/><text class="lbl" x="370" y="46">V</text>
  <rect class="btn" x="284" y="62" width="26" height="20"/><text class="lbl" x="297" y="76">O</text>
  <text x="345" y="76" font-size="12" font-weight="bold" fill="#444" text-anchor="middle">🎤 VOCALS</text>
  <rect class="btn" x="430" y="62" width="26" height="20"/><text class="lbl" x="443" y="76">P</text>
  <rect class="btnG" x="284" y="180" width="26" height="22"/><text class="lblW" x="297" y="195">L</text>
  <rect class="btnG" x="430" y="180" width="26" height="22"/><text class="lblW" x="443" y="195">R</text>
  <rect x="330" y="100" width="80" height="240" fill="#e8e6e0" stroke="#b9b4a8" rx="8"/>
  <rect x="338" y="220" width="64" height="34" fill="#ffffff" stroke="#8f8a80" rx="6"/>
  <rect class="btn" x="284" y="310" width="26" height="20"/><text class="lbl" x="297" y="324">G</text>
  <rect class="btn" x="430" y="310" width="26" height="20"/><text class="lbl" x="443" y="324">B</text>
  <text x="370" y="356" font-size="11" fill="#555" text-anchor="middle">10%</text>

  <rect class="btn" x="282" y="372" width="32" height="20"/><text class="lbl" x="298" y="386">+5</text>
  <rect class="btn" x="318" y="372" width="36" height="20"/><text class="lbl" x="336" y="386">+10</text>
  <rect class="btn" x="358" y="372" width="26" height="20"/><text class="lbl" x="371" y="386">D</text>
  <rect class="btn" x="388" y="372" width="34" height="20" stroke="#c0392b"/><text class="lbl" x="405" y="386" fill="#c0392b">+20</text>
  <rect class="btn" x="426" y="372" width="34" height="20" stroke="#c0392b"/><text class="lbl" x="443" y="386" fill="#c0392b">+50</text>

  <rect class="btn" x="288" y="404" width="70" height="26"/><text class="lbl" x="323" y="422">M</text>
  <rect class="btn" x="382" y="404" width="70" height="26"/><text class="lbl" x="417" y="422">S</text>

  <g font-size="10" fill="#888" text-anchor="middle">
    <text x="300" y="452">3</text><text x="324" y="452">4</text><text x="348" y="452">5</text><text x="372" y="452">6</text><text x="396" y="452">7</text><text x="420" y="452">8</text><text x="444" y="452">9</text>
    <text x="336" y="470">10</text><text x="372" y="470">17</text><text x="408" y="470">18</text>
  </g>

  <text class="callout" x="20" y="40">Vocals-hide toggle (V) — drops the</text>
  <text class="callout" x="20" y="55">strip when the singer sings live</text>
  <path class="lead" d="M215,50 C245,50 320,44 348,42"/>

  <text class="callout" x="20" y="105">O = solo-in-place (headphones)</text>
  <path class="lead" d="M195,101 C240,96 262,84 282,74"/>

  <text class="callout" x="510" y="76">P = pan / PFL probe</text>
  <path class="lead" d="M505,72 C490,72 470,72 458,72"/>

  <text class="callout" x="20" y="192">L / R — collapse this stem to the</text>
  <text class="callout" x="20" y="207">left or right output only</text>
  <path class="lead" d="M190,198 C240,198 260,192 282,191"/>

  <text class="callout" x="510" y="238">Fader — per-stem level.</text>
  <text class="callout" x="510" y="253">Audible level = fader × master;</text>
  <text class="callout" x="510" y="268">boosts multiply on top</text>
  <path class="lead" d="M505,243 C470,240 430,238 404,237"/>

  <text class="callout" x="510" y="330">B = bounce this stem to the</text>
  <text class="callout" x="510" y="345">XR18 bus (routing rows below)</text>
  <path class="lead" d="M505,328 C480,324 468,322 458,320"/>

  <text class="callout" x="20" y="352">G = gain-match group</text>
  <path class="lead" d="M170,348 C230,344 260,326 282,321"/>

  <text class="callout" x="20" y="398">+5 / +10 dB latching boost —</text>
  <text class="callout" x="20" y="413">mutually exclusive pair</text>
  <path class="lead" d="M195,398 C240,394 262,386 280,383"/>

  <text class="callout" x="510" y="390">+20 / +50 dB DIAGNOSTIC boost</text>
  <text class="callout" x="510" y="405">(~10× / ~316×) — hear Demucs bleed;</text>
  <text class="callout" x="510" y="420">will clip real signal</text>
  <path class="lead" d="M505,388 C490,386 478,384 464,383"/>

  <text class="callout" x="20" y="452">M = mute · S = solo</text>
  <text class="callout" x="20" y="467">(Cmd+1…6 / Cmd+Shift+1…6)</text>
  <path class="lead" d="M175,452 C240,448 262,432 286,422"/>

  <text class="callout" x="510" y="462">XR18 output channels — click a</text>
  <text class="callout" x="510" y="477">number to route this stem there</text>
  <path class="lead" d="M505,462 C480,462 466,458 452,454"/>

  <text x="380" y="530" font-size="12" fill="#666" text-anchor="middle">One of six identical strips: VOCALS · DRUMS · BASS · GUITAR · PIANO · OTHER</text>
</svg>
