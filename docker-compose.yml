# docker-compose.yml — runs the simpleStem container with the host's
# ~/ClaudeDrive bind-mounted so outputs land in
# ~/ClaudeDrive/simpleStem/STEMS exactly like the local install.
#
# Default command is `batch`. Override on the CLI:
#   docker compose run --rm simplestem stem "Title" "Artist"
#   docker compose run --rm simplestem stem "Title" "Artist" <video-id>
#   docker compose run --rm simplestem balance --dir /data/ClaudeDrive/simpleStem/STEMS/<song>
#   docker compose run --rm simplestem shell

services:
  simplestem:
    build:
      context: .
    image: simplestem:latest
    # Bind the host drive into the container. Defaults to ~/ClaudeDrive.
    # Compose v2 doesn't allow nested ${...} interpolation (you can't write
    # ${HOST_DRIVE:-${HOME}/...}), so to point at a non-default location
    # either set HOST_DRIVE in your shell:
    #   HOST_DRIVE=/Volumes/MyExternal/ClaudeDrive docker compose run ...
    # or override the mount on the CLI:
    #   docker compose run --rm -v /custom/path:/data/ClaudeDrive simplestem ...
    volumes:
      - "${HOME}/ClaudeDrive:/data/ClaudeDrive"
    # Container needs network access for yt-dlp + Google Sheet fetch.
    # (No restriction — default bridge network is fine.)
    command: ["batch"]
    # stdin_open + tty so `shell` subcommand gives an interactive prompt.
    stdin_open: true
    tty: true
