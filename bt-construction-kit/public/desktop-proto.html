<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>simpleStem — Sound Desktop prototype</title>
<style>
  * { box-sizing: border-box; margin: 0; user-select: none; -webkit-user-select: none; }
  html, body { height: 100%; }
  body {
    font: 13px/1.4 -apple-system, 'Helvetica Neue', sans-serif;
    background: linear-gradient(160deg, #1d2733 0%, #10161f 70%);
    color: #dfe6ee; overflow: hidden;
  }
  #hint {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.15);
    padding: 6px 14px; border-radius: 9px; font-size: 12px; z-index: 50;
    max-width: 80vw; text-align: center;
  }
  #hint b, #hint a { color: #7fd6a4; }
  #mic {
    position: fixed; top: 8px; right: 12px; z-index: 55; font-size: 20px;
    background: rgba(0,0,0,.5); border: 2px solid #f1c40f; border-radius: 50%;
    width: 40px; height: 40px; cursor: pointer; color: #fff;
  }
  #mic.on { border-color: #00e676; background: #00c853; animation: micpulse 1s infinite; }
  @keyframes micpulse { 50% { box-shadow: 0 0 0 8px rgba(0,230,118,0); } 0%,100% { box-shadow: 0 0 0 0 rgba(0,230,118,.6); } }
  .obj { position: absolute; width: 130px; text-align: center; cursor: grab; transition: transform .15s; }
  .obj:active { cursor: grabbing; }
  .obj .art { font-size: 52px; line-height: 1.1; filter: drop-shadow(0 4px 8px rgba(0,0,0,.5)); pointer-events: none; }
  .obj .label { margin-top: 3px; font-size: 11px; font-weight: 700; letter-spacing: .3px;
    background: rgba(0,0,0,.4); border-radius: 6px; padding: 2px 6px; display: inline-block; pointer-events: none; }
  .obj .sub { font-size: 10px; opacity: .6; pointer-events: none; }
  .machine .art { font-size: 64px; }
  .machine.legal { transform: scale(1.16); }
  .machine.legal .label { background: #1d8f4f; color: #fff; }
  .machine.illegal { filter: grayscale(1) brightness(.6); }
  .machine.working .art { animation: shake .12s linear infinite; }
  .machine.aggtarget { outline: 2px dashed #f1c40f; outline-offset: 8px; border-radius: 14px; }
  .machine.alive .art { animation: hum 1.8s ease-in-out infinite; }
  .machine.down { filter: grayscale(.8) brightness(.55); }
  .machine.down .label { background: rgba(231,76,60,.5); color: #fff; }
  @keyframes hum { 50% { transform: scale(1.05); } }
  @keyframes shake { 25% { transform: rotate(-3deg);} 75% { transform: rotate(3deg);} }
  .badge { position: absolute; top: -4px; right: 10px; font-size: 16px; }
  .dragging { opacity: .85; z-index: 40; pointer-events: none; transform: scale(1.05); }
  .bounce { animation: bounce .45s; }
  @keyframes bounce { 0%{transform:translateX(0)} 25%{transform:translateX(-14px)} 55%{transform:translateX(11px)} 80%{transform:translateX(-6px)} 100%{transform:translateX(0)} }
  .pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { 0% { transform: scale(.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

  /* ── sliced folder (three horizontal bands of the 📁 glyph) ─────────── */
  .folder-art { position: relative; width: 74px; height: 62px; margin: 0 auto; }
  .folder-art .slice { position: absolute; left: 0; width: 100%; overflow: hidden; font-size: 54px; line-height: 62px; }
  .folder-art .slice span { display: block; }
  .folder-art .s1 { top: 0; height: 21px; }
  .folder-art .s2 { top: 21px; height: 20px; } .folder-art .s2 span { transform: translateY(-21px); }
  .folder-art .s3 { top: 41px; height: 21px; } .folder-art .s3 span { transform: translateY(-41px); }
  .slicing .s1 { animation: cutL .55s ease-in-out infinite; }
  .slicing .s3 { animation: cutR .55s ease-in-out infinite; }
  @keyframes cutL { 0%,100% { transform: translateX(0);} 50% { transform: translateX(-16px);} }
  @keyframes cutR { 0%,100% { transform: translateX(0);} 50% { transform: translateX(16px);} }
  .folder-art .face {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 22px; padding-top: 14px; z-index: 2;
  }
  .dancing .face { display: flex; }
  .dancing { animation: rockdance .5s ease-in-out infinite; transform-origin: 50% 90%; }
  @keyframes rockdance { 0%,100% { transform: rotate(-9deg) scale(1.06);} 50% { transform: rotate(9deg) scale(1.06);} }

  /* flying file chips — slow, readable glide (Bill 2026-07-15: "slower
     so I can see the file name"); the label stays crisp for ~2 s and
     only fades at the very end of the flight */
  .chip {
    position: fixed; z-index: 45; font: 12px/1.2 Menlo, monospace; pointer-events: none;
    background: rgba(0,0,0,.78); border: 1px solid #7fd6a4; color: #a9f0c6;
    border-radius: 7px; padding: 5px 9px;
    transition: left 2.2s cubic-bezier(.35,.6,.4,1), top 2.2s cubic-bezier(.35,.6,.4,1),
                transform 2.2s cubic-bezier(.35,.6,.4,1), opacity .5s ease 1.8s;
    white-space: nowrap;
    box-shadow: 0 4px 14px rgba(0,0,0,.4);
  }

  /* the LIBRARY's drawer: slides open to accept a tagged folder */
  .lib-art { position: relative; display: inline-block; }
  .lib-drawer {
    position: absolute; left: 50%; bottom: -16px; width: 78px; height: 22px;
    transform: translateX(-50%) translateY(-10px) scaleY(0);
    transform-origin: top center;
    background: linear-gradient(#7c8ba0, #4a5665);
    border: 2px solid #2c3542; border-radius: 3px;
    transition: transform .45s cubic-bezier(.3,1.3,.5,1);
    z-index: 2;
  }
  .lib-drawer::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%,-50%);
    width: 20px; height: 5px; background: #20262f; border-radius: 2px;
  }
  .lib-drawer.out { transform: translateX(-50%) translateY(0) scaleY(1); }

  /* aggregates: two machines standing together; the second one's lid opens */
  .agg-arts { display: flex; align-items: flex-end; justify-content: center; gap: 2px; font-size: 54px; }
  .agg-arts .stage2 { position: relative; display: inline-block; }
  .agg-arts .lid {
    position: absolute; top: -6px; left: 8px; right: 8px; height: 12px;
    background: linear-gradient(#5a6a7d, #38434f); border-radius: 4px 4px 0 0;
    transform-origin: left bottom; transition: transform .5s; z-index: 3;
  }
  .agg-arts .lid.open { transform: rotate(-95deg); }

  #card {
    position: fixed; right: 18px; top: 60px; width: 330px; display: none;
    background: rgba(18,22,30,.97); border: 1px solid rgba(255,255,255,.18);
    border-radius: 12px; padding: 14px; z-index: 60; box-shadow: 0 16px 44px rgba(0,0,0,.5);
  }
  #card h3 { font-size: 13px; margin-bottom: 8px; color: #7fd6a4; }
  #card .file { font: 11px/1.7 Menlo, monospace; white-space: pre-wrap; }
  #card .meta-k { color: #f1c40f; }
  #card .empty { opacity: .45; font-style: italic; }
  #card .close { position: absolute; top: 8px; right: 10px; cursor: pointer; opacity: .6; }
  .gitbadge { font-size: 10px; color: #e8a33d; }
  /* live worklog rows: each file sparkles in as it is created */
  .ql-row {
    font: 11px/1.8 Menlo, monospace;
    display: flex; justify-content: space-between; gap: 10px;
    animation: sparkleIn .7s ease-out;
  }
  .ql-row .sz { opacity: .7; }
  .ql-row.fresh { color: #aef7cd; text-shadow: 0 0 8px rgba(0,230,118,.8); }
  /* stem states: spinning disk + bright brown while Demucs works on it,
     bold bright green + check + size when complete */
  .ql-row.working { color: #e8954a; font-weight: 700; }
  .ql-row.done { color: #00e676; font-weight: 800; }
  .ql-row .disk { display: inline-block; animation: diskspin .9s linear infinite; }
  @keyframes diskspin { to { transform: rotate(360deg); } }
  .ql-row .spark { animation: sparkFade 1.4s ease-out forwards; }
  @keyframes sparkleIn {
    0% { opacity: 0; transform: translateX(-14px) scale(.7); filter: brightness(2.5); }
    60% { filter: brightness(1.8); }
    100% { opacity: 1; transform: none; filter: none; }
  }
  @keyframes sparkFade { 0% { opacity: 1; } 100% { opacity: 0; } }

  /* hover peek */
  #peek {
    position: fixed; display: none; z-index: 70; max-width: 330px;
    background: rgba(18,22,30,.97); border: 1px solid rgba(127,214,164,.4);
    border-radius: 10px; padding: 9px 12px; font-size: 11px;
    box-shadow: 0 10px 30px rgba(0,0,0,.5); pointer-events: none;
  }
  #peek h4 { font-size: 11px; color: #7fd6a4; margin-bottom: 4px; }
  #peek .pk { font: 10px/1.6 Menlo, monospace; white-space: pre-wrap; opacity: .9; }

  /* right-click action menu */
  #ctx {
    position: fixed; display: none; z-index: 80; min-width: 190px;
    background: rgba(24,28,38,.98); border: 1px solid rgba(255,255,255,.18);
    border-radius: 10px; padding: 5px; box-shadow: 0 14px 40px rgba(0,0,0,.55);
  }
  #ctx .mi {
    padding: 7px 12px; border-radius: 7px; cursor: pointer; font-size: 12px;
  }
  #ctx .mi:hover { background: #1d8f4f; color: #fff; }
  #ctx .sep { height: 1px; background: rgba(255,255,255,.12); margin: 4px 6px; }
  #ctx .mi.user::before { content: '★ '; color: #f1c40f; }

  /* machine-role zones: the Librarian's work happens in the background */
  .zone {
    position: fixed; z-index: 0; border: 1px dashed rgba(255,255,255,.12);
    border-radius: 16px; pointer-events: none;
  }
  .zone .zlabel {
    position: absolute; top: 6px; left: 12px;
    font-size: 10px; font-weight: 800; letter-spacing: 1px;
    opacity: .35; text-transform: uppercase;
  }
  #zone-mini { background: rgba(120, 140, 180, .05); }
  #zone-laptop { background: rgba(0, 200, 120, .04); }

  /* the worklog pane flying into the library on completion */
  #card.flying {
    transition: all 1.1s cubic-bezier(.5,.1,.6,1);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="hint">Drag the <b>URL chip</b> onto the <b>STEMCUTTER</b> · drop a REAL .webloc on it to queue an actual render · <b>drag one machine onto another</b> to build an aggregate (stems + tags in one step) · 🎤 for voice building</div>
<button id="mic" title="Voice builder — say: connect stemcutter to tagger · take it apart · run the url">🎤</button>
<div class="zone" id="zone-mini" style="left:12px; top:60px; width:240px; height:0;"><span class="zlabel">Mac mini · Librarian (background)</span></div>
<div class="zone" id="zone-laptop" style="left:0; top:0; width:0; height:0;"><span class="zlabel">This laptop · Performer</span></div>
<div id="card"><span class="close" onclick="card.style.display='none'">✕</span><div id="card-body"></div></div>
<div id="peek"></div>
<div id="ctx"></div>

<script>
/* ── sounds ───────────────────────────────────────────────────────────── */
let AC = null;
function ac() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); return AC; }
function tone(f, t, dur, type, gain) {
  const c = ac(), o = c.createOscillator(), g = c.createGain();
  o.type = type || 'triangle'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain || .12, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .05);
}
const S = {
  pickup: () => tone(520, ac().currentTime, .09),
  legal:  () => tone(760, ac().currentTime, .12),
  drop:   () => { const t = ac().currentTime; tone(660, t, .1); tone(880, t + .09, .16); },
  thunk:  () => tone(110, ac().currentTime, .18, 'square', .18),
  saw:    (on) => { if (on) { S._saw = setInterval(() => tone(200 + Math.random()*140, ac().currentTime, .06, 'sawtooth', .05), 70); } else clearInterval(S._saw); },
  ticks:  (n) => { for (let i = 0; i < n; i++) tone(1400, ac().currentTime + i * .16, .04, 'square', .08); },
  whoosh: () => { const t = ac().currentTime; for (let i = 0; i < 6; i++) tone(900 - i * 110, t + i * .05, .07, 'sine', .06); },
  chime:  () => { const t = ac().currentTime; [659.25, 830.6, 987.8].forEach((f, i) => tone(f, t + i * .12, .5, 'sine', .1)); },
  dance:  () => { const t = ac().currentTime; [523, 659, 784, 659, 523, 659, 784, 1046].forEach((f, i) => tone(f, t + i * .22, .18, 'triangle', .09)); },
  riffle: () => { for (let i = 0; i < 4; i++) tone(300 + i * 120, ac().currentTime + i * .07, .05, 'triangle', .07); },
  latch:  () => { const t = ac().currentTime; tone(300, t, .1, 'square', .12); tone(450, t + .12, .14, 'square', .12); },
};

/* ── desk objects ─────────────────────────────────────────────────────── */
const desk = document.body;
const objects = [];
let machines = [];
function place(id, html, x, y, kind, cls) {
  const el = document.createElement('div');
  el.className = 'obj ' + (cls || '');
  el.id = id; el.innerHTML = html;
  el.style.left = x + 'px'; el.style.top = y + 'px';
  desk.appendChild(el);
  const o = { el, id, kind, x, y };
  objects.push(o);
  return o;
}
function machineDef(id, art, label, sub, x, y, accepts, work) {
  const m = place(id, `<div class="art">${art}</div><div class="label">${label}</div><div class="sub">${sub}</div>`, x, y, 'machine', 'machine');
  m.accepts = accepts; m.work = work; m.art = art; m.label = label;
  machines.push(m);
  return m;
}
const W = innerWidth, H = innerHeight;

place('url', `<div class="art">🔗</div><div class="label">youtube.com/…dQw4</div><div class="sub">a URL — drag me</div>`, 60, H*0.18, 'url');

const stemcutter = machineDef('stemcutter', '🎰', 'STEMCUTTER', 'URL slot · saws songs into stems', W*0.30, H*0.12, ['url'], 'stemcut');
const tagger     = machineDef('tagger', '🗳️', 'TAGGER', 'folder tray · fills the metadata card', W*0.60, H*0.12, ['folder-raw'], 'tag');
const library    = machineDef('library', '<span class="lib-art">🗄️<span class="lib-drawer"></span></span>', 'LIBRARY', 'loading your library…', W*0.60, H*0.60, ['folder-tagged'], 'shelve');
const amp        = machineDef('amp', '🎛️', 'THE AMP', 'drop anything playable', W*0.30, H*0.60, ['folder-raw','folder-tagged'], 'play');

// THE QUEUE TRAY — the pipeline's pending-work folder, live on the desk.
// Its badge is the REAL queue depth; its sub-label shows what the runner
// is doing right now. Chips fly tray → Stemcutter when a job is picked
// up. Right-click for the flow instruments.
const qtray = machineDef('qtray', '📥', 'QUEUE', 'connecting…', 60, H*0.55, ['url'], 'queue');
qtray.el.querySelector('.art').insertAdjacentHTML('beforeend', '<span class="badge" id="q-badge">…</span>');

// Machine-role zones: the URL chip + QUEUE tray live in the Librarian's
// background strip (the mini does ingest); the machines live in the
// Performer's zone (this laptop renders and plays).
(function layoutZones() {
  const zm = document.getElementById('zone-mini');
  zm.style.left = '18px'; zm.style.top = (H * 0.06) + 'px';
  zm.style.width = '215px'; zm.style.height = (H * 0.80) + 'px';
  const zl = document.getElementById('zone-laptop');
  zl.style.left = (W * 0.26) + 'px'; zl.style.top = (H * 0.06) + 'px';
  zl.style.width = (W * 0.62) + 'px'; zl.style.height = (H * 0.80) + 'px';
})();

// ── THE WHOLE SYSTEM, ILLUSTRATED — one live object per process and
// data source in the real workflow (Bill 2026-07-15):
//   mini zone:   LIBRARIAN robot (webloc_watch + daemons) · SHEET
//                (band songlist / mpb_sync) · CATALOG (catalog.py) ·
//                QUEUE tray (INCOMING_WEBLOC + STEM_QUEUE)
//   boundary:    DRIVE cloud (Google Drive sync between machines)
//   laptop zone: STEMCUTTER (queue_runner + Demucs) · TAGGER
//                (metadata.py) · GIG BINDER (GIGS/SETLISTS) · CACHE
//                (~/.bt-cache offline contract) · LIBRARY (STEMS/) ·
//                AMP (portal player) · XR18 (18-ch USB out)
const robot   = machineDef('robot', '🤖', 'LIBRARIAN', 'checking daemons…', 60, H*0.08, [], 'info');
const sheet   = machineDef('sheet', '📊', 'SONGLIST SHEET', 'Google Sheet · mpb_sync daily', 60, H*0.30, [], 'info');
const catalog = machineDef('catalog', '📇', 'CATALOG', 'catalog.json · hourly pass', 60, H*0.42, [], 'info');
const drive   = machineDef('drive', '☁️', 'DRIVE', 'syncs everything between machines', W*0.225, H*0.34, [], 'info');
const gigbind = machineDef('gigbind', '🧳', 'GIG BINDER', 'loading gigs…', W*0.45, H*0.10, [], 'info');
const cacheOb = machineDef('cache', '🧰', 'CACHE', 'loading cache…', W*0.45, H*0.58, [], 'info');
const xr18    = machineDef('xr18', '🎚️', 'XR18', '18-ch USB out · the band hears this', W*0.74, H*0.58, [], 'info');
const logic   = machineDef('logic', '🎹', 'LOGIC PRO', 'drop an audio file — opens IN Logic', W*0.74, H*0.10, ['audio'], 'logic');
let libState = null, cacheState = null, gigList = null;

/* ── REAL DATA: the desk boots from Bill's actual library ─────────────── */
let realLib = [];        // /api/library songs
let realSong = null;     // the song the demo chip represents
async function loadRealLibrary() {
  try {
    const j = await fetch('/api/library').then(r => r.json());
    realLib = (j.songs || j || []).filter(x => x && x.title);
    const stemsSongs = realLib.filter(x => x.type === 'stems');
    realSong = stemsSongs[Math.floor(Math.random() * stemsSongs.length)] || null;
    library.el.querySelector('.sub').textContent = `${realLib.length} song folders · claude.md + git each`;
    if (realSong) {
      const chip = document.getElementById('url');
      chip.querySelector('.label').textContent = realSong.title.slice(0, 22);
      chip.querySelector('.sub').textContent = 'from YOUR library — drag me';
    }
  } catch (e) { console.warn('[desk] library load failed:', e); }
}
loadRealLibrary();
function findRealSong(title) {
  const t = String(title || '').toLowerCase();
  return realLib.find(x => x.title && (t.includes(x.title.toLowerCase()) || x.title.toLowerCase().includes(t))) || null;
}
function fmtDur(sec) { if (!sec || !isFinite(sec)) return '—'; const m = Math.floor(sec / 60), s2 = Math.round(sec % 60); return `${m}:${String(s2).padStart(2, '0')}`; }

/* ── the folder document ──────────────────────────────────────────────── */
let folder = null, folderStage = null, folderName = 'Never_Gonna_Give_You_Up';
let folderSong = null;   // the REAL library row behind this folder, if any
let folderTitle = null;  // human title (oEmbed or library) — reveal uses it to find the dir
const META_EMPTY = `<span class="meta-k">bpm</span>: <span class="empty">—</span>  <span class="meta-k">key</span>: <span class="empty">—</span>
<span class="meta-k">title/artist</span>: <span class="empty">—</span>
<span class="meta-k">sections</span>: <span class="empty">[ empty — place breaks here ]</span>
<span class="meta-k">stem mix trims</span>: <span class="empty">—</span>
<span class="meta-k">plays</span>: <span class="empty">—</span>  <span class="meta-k">last played</span>: <span class="empty">—</span>`;
function metaFull() {
  const sg = folderSong;
  if (!sg) return `<span class="meta-k">status</span>: <span class="empty">still rendering — real metadata lands when the pipeline finishes (watch the portal queue)</span>`;
  return `<span class="meta-k">bpm</span>: ${sg.practiceBpm || sg.bpm || '—'}   <span class="meta-k">key</span>: ${sg.key || '—'}
<span class="meta-k">title/artist</span>: ${sg.title} — ${sg.artist || '—'}
<span class="meta-k">duration</span>: ${fmtDur(sg.duration_sec || sg.duration)}   <span class="meta-k">singer</span>: ${sg.singer_lead || '—'}
<span class="meta-k">sections</span>: ${Array.isArray(sg.sections) && sg.sections.length ? sg.sections.length + ' placed' : '—'}
<span class="meta-k">plays</span>: ${sg.plays != null ? sg.plays : '—'}   <span class="meta-k">last played</span>: ${sg.lastPlayedAt ? String(sg.lastPlayedAt).slice(0, 10) : '—'}`;
}
function folderCard() {
  const tagged = folderStage !== 'raw';
  return `<h3>📁 ${folderName}</h3>
  <div class="file">🎵 vocals.m4a  drums.m4a  bass.m4a
🎵 guitar.m4a  piano.m4a  other.m4a
🎼 source.wav
📄 metadata.json ${tagged ? '' : '<span class="empty">(empty — feed me to the TAGGER)</span>'}
${tagged ? metaFull() : META_EMPTY}
📝 claude.md <span class="empty">— standing instructions for this song</span>
📒 runlog.md <span class="empty">— what each machine noticed, for next time</span>
<span class="gitbadge">⎇ git: ${tagged ? '2 commits (stemcut, tagged)' : '1 commit (stemcut)'}</span></div>`;
}
const card = document.getElementById('card');
function showCard() { document.getElementById('card-body').innerHTML = folderCard(); card.style.display = 'block'; S.riffle(); }

/* ── LIVE WORKLOG: the quick-look stays open during stemming and every
   file sparkles in as it is created (Bill 2026-07-14: "I want to
   visually see the addition of each piece of work"). Demo runs feed it
   from the chip schedule; REAL renders feed it by polling
   /api/desktop/inspect and sparkling in files as they land on disk. */
const liveRows = new Map();   // name → {el, size, state}
const EXPECTED_FILES = ['vocals.m4a','drums.m4a','bass.m4a','guitar.m4a','piano.m4a','other.m4a','source.wav'];
function openLiveCard(title) {
  liveRows.clear();
  // Header carries the SIMPLE SONG NAME (Bill 2026-07-15), not the slug.
  const nice = (folderTitle || String(title || '').replace(/_/g, ' ')).replace(/\s*\(.*?\)\s*$/, '').slice(0, 44);
  document.getElementById('card-body').innerHTML =
    `<h3>🎵 ${nice}</h3><div class="file empty" style="margin:-4px 0 8px">stemming in progress…</div>
     <div id="live-rows"></div>
     <div class="file empty" id="live-note">watching for files…</div>`;
  card.style.display = 'block';
  card.classList.remove('flying');
  card.style.transform = ''; card.style.opacity = '';
  // Pre-populate every expected file as WORKING: spinning disk, brown.
  for (const f of EXPECTED_FILES) liveSetRow(f, 'working', null);
}

// When every file is done: the whole pane flies to the LIBRARY, the
// drawer opens, the work is filed, the drawer shuts (Bill 2026-07-15).
function flyWorklogToLibrary() {
  const lib = machines.find(m => m.work === 'shelve');
  if (!lib) { card.style.display = 'none'; return; }
  const drawer = lib.el.querySelector('.lib-drawer');
  drawer.classList.add('out'); S.whoosh();
  const r = lib.el.getBoundingClientRect();
  const cr = card.getBoundingClientRect();
  card.classList.add('flying');
  requestAnimationFrame(() => {
    card.style.transform =
      `translate(${r.x + r.width / 2 - (cr.x + cr.width / 2)}px, ${r.y + r.height - cr.y}px) scale(.06)`;
    card.style.opacity = '0.15';
  });
  setTimeout(() => {
    drawer.classList.remove('out');
    card.style.display = 'none';
    card.classList.remove('flying');
    card.style.transform = ''; card.style.opacity = '';
    S.latch(); S.chime();
    lib.el.querySelector('.sub').textContent = `${realLib.length + 1} song folders · claude.md + git each`;
    hint('Filed into the <b>LIBRARY</b> — drawer closed. The song is ready to play.');
  }, 1300);
}
// state: 'working' (💿 spins, bright brown) | 'done' (✓ green bold + size)
function liveSetRow(name, state, sizeTxt) {
  const zone = document.getElementById('live-rows');
  if (!zone) return;
  let row = liveRows.get(name);
  if (!row) {
    const el = document.createElement('div');
    el.className = 'ql-row ' + state;
    zone.appendChild(el);
    row = { el, size: null, state: null };
    liveRows.set(name, row);
  }
  const changed = state !== row.state || (sizeTxt && sizeTxt !== row.size);
  row.state = state; row.size = sizeTxt || row.size;
  row.el.className = 'ql-row ' + state + (changed && state === 'done' ? ' fresh' : '');
  if (state === 'working') {
    row.el.innerHTML = `<span><span class="disk">💿</span> ${name}</span><span class="sz">${sizeTxt || 'working…'}</span>`;
  } else {
    row.el.innerHTML = `<span>✓ ${name} <span class="spark">✨</span></span><span class="sz">${sizeTxt || ''}</span>`;
    if (changed) {
      tone(1200 + liveRows.size * 90, ac().currentTime, .12, 'sine', .08);
      setTimeout(() => row.el.classList.remove('fresh'), 1600);
    }
  }
}
let livePollTimer = null;
function pollRealFolder(title) {
  clearInterval(livePollTimer);
  const t0 = Date.now();
  const note = () => document.getElementById('live-note');
  livePollTimer = setInterval(async () => {
    if (Date.now() - t0 > 35 * 60 * 1000) { clearInterval(livePollTimer); return; }
    try {
      const j = await fetch('/api/desktop/inspect?base=&title=' + encodeURIComponent(title)).then(r => r.json());
      if (!j.ok) { if (note()) note().textContent = 'queued — no folder on disk yet…'; return; }
      if (note()) note().textContent = j.path;
      // A file is DONE when its size is nonzero and unchanged since the
      // last check; present-but-growing stays WORKING with the live size.
      const seen = new Map((j.files || []).map(f => [f.name, f.size]));
      if (!pollRealFolder._last) pollRealFolder._last = new Map();
      for (const [nm, size] of seen) {
        if (!EXPECTED_FILES.includes(nm) && nm !== 'metadata.json') continue;
        const prev = pollRealFolder._last.get(nm);
        if (size > 0 && prev === size) liveSetRow(nm, 'done', fmtBytes(size));
        else liveSetRow(nm, 'working', size > 0 ? fmtBytes(size) : null);
      }
      pollRealFolder._last = seen;
      // A stem finishing is WORK IN FLIGHT: a chip launches from the
      // Stemcutter across the desk to the worklog pane.
      for (const [nm, size] of seen) {
        const row = liveRows.get(nm);
        if (row && row.state === 'done' && !row._flew) {
          row._flew = true;
          const sc2 = machines.find(m => m.work === 'stemcut' || m.work === 'aggregate');
          const cr = card.getBoundingClientRect();
          if (sc2 && cr.width) flyChip(center(sc2.el), { x: cr.x + 60, y: cr.y + 60 }, '🎵 ' + nm);
        }
      }
      const stems = ['vocals.m4a','drums.m4a','bass.m4a','guitar.m4a','piano.m4a','other.m4a'];
      if (stems.every(nm => liveRows.get(nm) && liveRows.get(nm).state === 'done')) {
        clearInterval(livePollTimer);
        if (note()) note().textContent = j.path + ' — all six stems landed ✓';
        S.chime();
        setTimeout(flyWorklogToLibrary, 1400);
      }
    } catch (e) {}
  }, 6000);
}
function hint(t) { document.getElementById('hint').innerHTML = t; }
function center(el) { const r = el.getBoundingClientRect(); return { x: r.x + r.width / 2, y: r.y + r.height / 2 }; }

/* ── THE STEMCUT SHOW ─────────────────────────────────────────────────────
   1. a folder named after the song pops out beside the machine
   2. file chips FLY from the machine into the folder, one by one
   3. the folder is sliced apart and reassembled while Demucs "works"
   4. done: the folder stands tall and dances with a smile for 5 s
   5. only then does it become draggable                                  */
function stemcutShow(machine, name, done) {
  folderName = name;
  machine.el.classList.add('working'); S.saw(true);
  const fx = machine.x - 10, fy = machine.y + 180;
  folder = place('folder',
    `<div class="art folder-art slicing">
       <div class="slice s1"><span>📁</span></div>
       <div class="slice s2"><span>📁</span></div>
       <div class="slice s3"><span>📁</span></div>
       <div class="face">😄</div>
     </div>
     <div class="label">${name}</div><div class="sub">building… 0/7 files</div>`,
    fx, fy, 'building', 'pop');
  folderStage = 'raw';
  hint(`The <b>Stemcutter</b> is sawing <b>${name}</b> — stems are flying into the folder…`);
  openLiveCard(name);   // quick-look stays open; files sparkle in below
  const files = ['vocals.m4a','drums.m4a','bass.m4a','guitar.m4a','piano.m4a','other.m4a','source.wav'];
  const from = center(machine.el);
  files.forEach((f, i) => {
    setTimeout(() => {
      const chip = document.createElement('div');
      chip.className = 'chip'; chip.textContent = '🎵 ' + f;
      chip.style.left = from.x + 'px'; chip.style.top = from.y + 'px';
      desk.appendChild(chip);
      const to = center(folder.el);
      requestAnimationFrame(() => {
        chip.style.left = (to.x - 20) + 'px'; chip.style.top = to.y + 'px';
        chip.style.opacity = '0'; chip.style.transform = 'scale(.5)';
      });
      S.whoosh();
      setTimeout(() => { chip.remove(); liveSetRow(f, 'done', (4.5 + Math.random() * 3).toFixed(1) + ' MB'); }, 2250);
      folder.el.querySelector('.sub').textContent = `building… ${i + 1}/7 files`;
    }, 400 + i * 800);
  });
  const workMs = 400 + files.length * 800 + 2300;
  setTimeout(() => {
    machine.el.classList.remove('working'); S.saw(false);
    const artEl = folder.el.querySelector('.folder-art');
    artEl.classList.remove('slicing');
    // THE DANCE: stands tall, rocks with a smile for 5 s
    artEl.classList.add('dancing');
    folder.el.querySelector('.sub').textContent = '6 stems cut! 🎉';
    S.chime(); S.dance();
    hint(`<b>${name}</b> is done — look at that happy folder. 5 seconds of joy, then it's yours to drag.`);
    setTimeout(() => {
      artEl.classList.remove('dancing');
      folder.kind = 'folder';                 // NOW it's draggable
      folder.el.querySelector('.sub').textContent = '6 stems + empty metadata — drag me';
      hint(`Drag <b>${name}</b> onto the <b>TAGGER</b> (or double-click to peek inside).`);
      if (done) done();
    }, 5000);
  }, workMs);
}

function taggerShow(machine, done) {
  machine.el.classList.add('working'); S.ticks(8);
  hint('The <b>Tagger</b> is ticking its checkboxes… (bpm · key · sections · mix trims · plays)');
  setTimeout(() => {
    machine.el.classList.remove('working'); S.chime();
    folderStage = 'tagged';
    const bpmTxt = folderSong ? `${folderSong.practiceBpm || folderSong.bpm || '—'} bpm · ${folderSong.key || '—'}` : 'awaiting render';
    folder.el.querySelector('.sub').textContent = `metadata filled ✓ ${bpmTxt}`;
    hint('Metadata filled from YOUR library (peek!). Shelve it: drag the folder into the <b>LIBRARY</b>.');

}

/* ── drag engine ──────────────────────────────────────────────────────── */
let drag = null;
desk.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;   // right/middle press must NOT start a drag
                                // (it stole pointer-events and broke the
                                // context menu + dblclick with real mice)
  const el = e.target.closest('.obj');
  if (!el) return;
  const o = objects.find(x => x.el === el);
  if (!o) return;
  if (o.kind === 'building') return;                       // mid-show: hands off
  // Machines drag PLAINLY now (Bill 2026-07-15): drop one on another to
  // build an aggregate, or drop on empty desk to rearrange. A press
  // without movement is still just a click.
  drag = { o, dx: e.clientX - el.offsetLeft, dy: e.clientY - el.offsetTop, moved: false,
           machineDrag: o.kind === 'machine' };
  S.pickup();
});
desk.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.moved) {
    // The .dragging class (pointer-events:none) goes on only once the
    // pointer actually MOVES — a stationary press must keep normal hit
    // testing so click/dblclick/contextmenu still target the object.
    drag.moved = true;
    drag.o.el.classList.add('dragging');
  }
  drag.o.el.style.left = (e.clientX - drag.dx) + 'px';
  drag.o.el.style.top = (e.clientY - drag.dy) + 'px';
  for (const m of machines) {
    if (m === drag.o) continue;
    const hit = overlaps(drag.o.el, m.el);
    if (drag.machineDrag) {
      m.el.classList.toggle('aggtarget', hit);
    } else {
      const legal = m.accepts.includes(dragKind());
      m.el.classList.toggle('legal', hit && legal);
      m.el.classList.toggle('illegal', hit && !legal);
      if (hit && legal && !m._toned) { m._toned = true; S.legal(); }
      if (!hit) m._toned = false;
    }
  }
});
desk.addEventListener('pointerup', () => {
  if (!drag) return;
  const o = drag.o;
  o.el.classList.remove('dragging');
  let handled = false;
  for (const m of [...machines]) {
    m.el.classList.remove('legal', 'illegal', 'aggtarget');
    if (handled || m === o || !overlaps(o.el, m.el)) continue;
    if (drag.machineDrag) { makeAggregate(o, m); handled = true; }
    else if (m.accepts.includes(dragKind())) { runMachine(m, o); handled = true; }
    else { o.el.classList.add('bounce'); setTimeout(() => o.el.classList.remove('bounce'), 500); S.thunk(); handled = true; }
  }
  if (drag.machineDrag) { o.x = o.el.offsetLeft; o.y = o.el.offsetTop; }
  if (!drag.moved && o === folder) showCard();
  drag = null;
});
desk.addEventListener('dblclick', (e) => {
  if (folder && e.target.closest('.obj') === folder.el) showCard();
});
function dragKind() {
  if (!drag) return null;
  if (drag.o.kind === 'url') return 'url';
  return folderStage === 'raw' ? 'folder-raw' : 'folder-tagged';
}
function overlaps(a, b) {
  const r1 = a.getBoundingClientRect(), r2 = b.getBoundingClientRect();
  return !(r1.right < r2.left + 20 || r1.left > r2.right - 20 || r1.bottom < r2.top + 20 || r1.top > r2.bottom - 20);
}

/* ── AGGREGATES: the machine that builds machines ─────────────────────────
   ⌃control-drag machine A onto machine B (or say "connect A to B").
   The two machines latch together into ONE aggregate standing side by
   side. Feeding the aggregate runs A; A's output folder flies up, B's lid
   opens, the folder drops in, B runs, and the finished folder pops out. */
let aggregates = [];
function makeAggregate(a, b) {
  if (a.aggregate || b.aggregate) { hint('Aggregates of aggregates — round three. Take this one apart first.'); S.thunk(); return; }
  if (!(a.work === 'stemcut' && b.work === 'tag')) {
    hint(`<b>${a.label}→${b.label}</b> isn't a legal chain yet: the demo wires STEMCUTTER→TAGGER. (The grammar: A's output type must match B's intake.)`);
    S.thunk(); return;
  }
  a.el.style.display = 'none'; b.el.style.display = 'none';
  machines = machines.filter(m => m !== a && m !== b);
  const agg = place('agg_' + Date.now(),
    `<div class="agg-arts"><span class="stage1">${a.art}</span><span class="stage2"><span class="lid"></span>${b.art}</span></div>
     <div class="label">${a.label} → ${b.label}</div>
     <div class="sub">aggregate · feed it a URL</div>`,
    b.x - 40, b.y, 'machine', 'machine');
  agg.el.style.width = '190px';
  agg.accepts = a.accepts; agg.work = 'aggregate'; agg.parts = [a, b];
  agg.label = a.label + '→' + b.label;
  machines.push(agg); aggregates.push(agg);
  S.latch(); S.chime();
  hint(`Built <b>${agg.label}</b> — one machine now. Feed it the URL chip (or a real .webloc). ⌥option-double-click to take it apart.`);
  agg.el.addEventListener('dblclick', (e) => { if (e.altKey) disassemble(agg); });
  return agg;
}
function disassemble(agg) {
  const [a, b] = agg.parts;
  a.el.style.display = ''; b.el.style.display = '';
  a.el.style.left = (agg.el.offsetLeft - 80) + 'px'; a.x = agg.el.offsetLeft - 80;
  b.el.style.left = (agg.el.offsetLeft + 120) + 'px'; b.x = agg.el.offsetLeft + 120;
  a.el.style.top = b.el.style.top = agg.el.offsetTop + 'px'; a.y = b.y = agg.el.offsetTop;
  machines = machines.filter(m => m !== agg).concat([a, b]);
  aggregates = aggregates.filter(x => x !== agg);
  agg.el.remove();
  S.thunk(); hint(`Took <b>${agg.label}</b> apart — two machines again.`);
}
function feedFolderIntoStage2(agg, done) {
  const lid = agg.el.querySelector('.lid');
  const stage2 = agg.el.querySelector('.stage2');
  lid.classList.add('open'); S.whoosh();
  hint(`The <b>${agg.label}</b> aggregate opens its second machine — the folder climbs in…`);
  const to = stage2.getBoundingClientRect();
  folder.el.style.transition = 'all .9s cubic-bezier(.4,.2,.5,1)';
  folder.el.style.left = (to.x - 20) + 'px';
  folder.el.style.top = (to.y - 90) + 'px';
  setTimeout(() => {
    folder.el.style.top = (to.y - 10) + 'px';
    folder.el.style.transform = 'scale(.15)'; folder.el.style.opacity = '0';
  }, 900);
  setTimeout(() => {
    lid.classList.remove('open');
    folder.el.style.display = 'none';
    done();
  }, 1700);
}
function popFolderOutOfAggregate(agg) {
  folder.el.style.transition = 'none';
  folder.el.style.display = '';
  folder.el.style.left = (agg.el.offsetLeft + 30) + 'px';
  folder.el.style.top = (agg.el.offsetTop + 170) + 'px';
  folder.el.style.transform = ''; folder.el.style.opacity = '';
  folder.el.classList.add('pop');
  const artEl = folder.el.querySelector('.folder-art');
  artEl.classList.add('dancing'); S.dance();
  hint(`<b>${folderName}</b> came out the far end tagged — one drop, whole pipeline. 🎉`);
  setTimeout(() => { artEl.classList.remove('dancing'); folder.kind = 'folder'; }, 5000);
}

/* ── machines run ─────────────────────────────────────────────────────── */
function runMachine(m, o) {
  S.drop();
  const demoName = realSong ? realSong.title.replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '_') : 'New_Song';
  if (m.work === 'stemcut') {
    o.el.remove(); objects.splice(objects.indexOf(o), 1);
    folderSong = realSong; folderTitle = realSong && realSong.title;
    stemcutShow(m, demoName);
  } else if (m.work === 'aggregate') {
    o.el.remove(); objects.splice(objects.indexOf(o), 1);
    folderSong = realSong; folderTitle = realSong && realSong.title;
    const [a, b] = m.parts;
    stemcutShow(Object.assign({}, a, { el: m.el, x: m.el.offsetLeft, y: m.el.offsetTop }), demoName, () => {
      folder.kind = 'building';
      feedFolderIntoStage2(m, () => {
        m.el.classList.add('working'); S.ticks(8);
        setTimeout(() => {
          m.el.classList.remove('working');
          folderStage = 'tagged';
          const bt = folderSong ? `${folderSong.practiceBpm || folderSong.bpm || '—'} bpm · ${folderSong.key || '—'}` : 'awaiting render';
          folder.el.querySelector('.sub').textContent = `metadata filled ✓ ${bt}`;
          popFolderOutOfAggregate(m);
        }, 1800);
      });
    });
  } else if (m.work === 'tag') {
    taggerShow(m);
  } else if (m.work === 'shelve') {
    // THE DRAWER: the cabinet slides its drawer open, the folder settles
    // into it, and the drawer closes with a clunk.
    const drawer = m.el.querySelector('.lib-drawer');
    drawer.classList.add('out'); S.whoosh();
    hint('The <b>LIBRARY</b> opens a drawer for the new song…');
    const dr = drawer.getBoundingClientRect();
    setTimeout(() => {
      folder.el.style.transition = 'all .8s cubic-bezier(.4,.2,.5,1)';
      folder.el.style.left = (dr.x + dr.width / 2 - 37) + 'px';
      folder.el.style.top = (dr.y - 40) + 'px';
      setTimeout(() => {
        folder.el.style.top = (dr.y - 14) + 'px';
        folder.el.style.transform = 'scale(.18)'; folder.el.style.opacity = '0';
      }, 800);
    }, 480);
    setTimeout(() => {
      drawer.classList.remove('out');
      folder.el.remove();
      S.latch(); S.chime();
      m.el.querySelector('.sub').textContent = `${realLib.length + 1} song folders · claude.md + git each`;
      folderStage = 'shelved';
      hint(`<b>${folderName}</b> filed — drawer closed. claude.md + runlog.md + git ride along in every song folder. Refresh to run the loop again.`);
    }, 2100);
  } else if (m.work === 'play') {
    const t = ac().currentTime; [164.8, 207.6, 246.9, 329.6].forEach(f => tone(f, t, 1.2, 'sine', .06));
    hint('🔊 The <b>Amp</b> plays whatever lands on it.');
  } else if (m.work === 'queue') {
    hint('The <b>QUEUE tray</b> holds the pipeline\'s pending work — right-click it to look into the flow.');
    showQueueCard();
  }
}

/* ── PIPELINE INSTRUMENTATION: poll the real queue, animate the flow ──── */
let lastQueue = null;
async function pollSystem() {
  try {
    const q = await fetch('/api/queue').then(r => r.json());
    const incoming = (q.incoming || []).length;
    const queued = (q.queued || []).length;
    const depth = incoming + queued;
    const badge = document.getElementById('q-badge');
    if (badge) badge.textContent = depth;
    const proc = q.processing;
    qtray.el.querySelector('.sub').textContent =
      `${incoming} incoming · ${queued} queued` +
      (proc ? ` · rendering: ${String(proc.name || proc.base || proc).slice(0, 24)}` : '') +
      ((q.failed || []).length ? ` · ${q.failed.length} failed ⚠` : '');
    const sc = machines.find(m => m.work === 'stemcut' || m.work === 'aggregate');
    if (sc) {
      const busy = !!proc;
      sc.el.classList.toggle('working', busy);
      const scSub = sc.el.querySelector('.sub');
      if (busy && scSub) scSub.textContent = `RENDERING: ${String(proc.name || proc.base || proc).slice(0, 26)}${proc.phase ? ' · ' + proc.phase : ''}`;
      else if (scSub && sc.work === 'stemcut') scSub.textContent = 'URL slot · saws songs into stems';
    }
    if (lastQueue) {
      if (depth > lastQueue.depth) S.drop();
      // Librarian ingested one (incoming shrank): chip crosses from the
      // background zone into the Performer's zone.
      if (incoming < lastQueue.incoming && sc) flyChip(center(qtray.el), center(sc.el), '📄 ingested by the Librarian');
      if (!lastQueue.proc && proc && sc) { S.whoosh(); flyChip(center(qtray.el), center(sc.el), '📄 ' + String(proc.name || 'job').slice(0, 18)); }
      if (lastQueue.proc && !proc) S.chime();
      // Ambient in-flight while a REAL render runs: something visibly
      // moves every poll so the shaking machine is never doing "nothing".
      if (proc && sc) {
        const cr = card.getBoundingClientRect();
        const dest = (card.style.display === 'block' && cr.width) ? { x: cr.x + 60, y: cr.y + 40 } : center(qtray.el);
        flyChip(center(sc.el), dest, '⚙ ' + String(proc.phase || 'rendering…').slice(0, 22));
      }
    }
    lastQueue = { depth, incoming, proc: !!proc };
    qtray._raw = q;
  } catch (e) {}
  // Slow instruments: daemons, cache, gigs — every 4th tick (~24 s).
  pollSystem._n = (pollSystem._n || 0) + 1;
  if (pollSystem._n % 4 === 1) pollSlowInstruments();
}
async function pollSlowInstruments() {
  try {
    const ls = await fetch('/api/librarian/state').then(r => r.json());
    libState = (ls && ls.state) || ls;
    const daemons = libState.librarianDaemons || {};
    const watcher = daemons['lib-watcher'];
    const alive = watcher ? !!watcher.running : null;
    robot.el.classList.toggle('alive', alive === true);
    robot.el.classList.toggle('down', alive === false);
    robot.el.querySelector('.sub').textContent =
      alive === true ? `ingesting weblocs · pid ${watcher.pid} · all quiet` :
      alive === false ? '⚠ WATCHER DOWN — nothing ingests' : 'daemon state unknown';
    const mpb = daemons['lib-mpbsync'];
    sheet.el.classList.toggle('down', mpb ? !mpb.running : false);
  } catch (e) {}
  try {
    const cr = await fetch('/api/cache/status').then(r => r.json());
    const c = (cr && cr.state) || cr;
    cacheState = c;
    const done = c.done != null ? c.done : c.cached, total = c.total;
    if (done != null && total != null) {
      cacheOb.el.querySelector('.sub').textContent = `${done}/${total} songs cached offline`;
      cacheOb.el.classList.toggle('down', done < total);
    }
  } catch (e) {}
  try {
    const g = await fetch('/api/gigs').then(r => r.json());
    gigList = g.gigs || g;
    if (Array.isArray(gigList)) gigbind.el.querySelector('.sub').textContent = `${gigList.length} gigs on file`;
  } catch (e) {}
  catalog.el.querySelector('.sub').textContent = `${realLib.length} songs indexed · hourly pass`;
}
function flyChip(from, to, text) {
  const chip = document.createElement('div');
  chip.className = 'chip'; chip.textContent = text;
  chip.style.left = from.x + 'px'; chip.style.top = (from.y - 50) + 'px';
  desk.appendChild(chip);
  requestAnimationFrame(() => {
    chip.style.left = (to.x - 20) + 'px'; chip.style.top = to.y + 'px';
    chip.style.opacity = '0.2';
  });
  setTimeout(() => chip.remove(), 2500);
}
setInterval(pollSystem, 6000);
pollSystem();

// CACHE double-click: an in-desk FILE TREE of ~/.bt-cache (Bill
// 2026-07-15), scrollable, with per-branch file counts and sizes.
async function showCacheTree() {
  document.getElementById('card-body').innerHTML = '<h3>🧰 ~/.bt-cache</h3><div class="file">reading the tree…</div>';
  card.style.display = 'block'; S.riffle();
  try {

const micBtn = document.getElementById('mic');

function machineByName(word) {
  word = (word || '').toLowerCase();
  if (word.includes('stem') || word.includes('cut')) return machines.find(m => m.work === 'stemcut');
  if (word.includes('tag')) return machines.find(m => m.work === 'tag');
  if (word.includes('libr')) return machines.find(m => m.work === 'shelve');
  if (word.includes('amp')) return machines.find(m => m.work === 'play');
  return null;
}
function voiceCommand(text) {
  text = text.toLowerCase();
  let m;
  if ((m = text.match(/connect (?:the )?(\w+) (?:to|and|with) (?:the )?(\w+)/))) {
    const a = machineByName(m[1]), b = machineByName(m[2]);
    if (a && b) { makeAggregate(a, b); return true; }
    hint(`Couldn't find both machines in “${text}”.`); return false;
  }
  if (/take (it|.*) apart|disassemble|separate the/.test(text)) {
    if (aggregates.length) { disassemble(aggregates[aggregates.length - 1]); return true; }
    hint('No aggregate to take apart.'); return false;
  }
  if (/run|feed|start/.test(text) && /url|link|song/.test(text)) {
    const target = machines.find(mm => mm.work === 'aggregate') || machines.find(mm => mm.work === 'stemcut');
    const chip = objects.find(oo => oo.kind === 'url');
    if (target && chip) { runMachine(target, chip); return true; }
    hint('Nothing to feed — the URL chip is gone. Refresh the desk.'); return false;
  }
  hint(`Voice builder heard “${text}” — try: <b>connect stemcutter to tagger</b> · <b>take it apart</b> · <b>run the url</b>`);
  return false;
}
micBtn.addEventListener('click', () => {

    }

  rec.onend = () => { if (listening) { try { rec.start(); } catch (e) {} } };
  try { rec.start(); listening = true; micBtn.classList.add('on'); hint('🎤 Voice builder on — say: <b>connect stemcutter to tagger</b>'); }

    if (o.work === 'stemcut' || o.work === 'aggregate') items.push({ label: '📡 Current render status', run: showQueueCard });
    if (o.work === 'aggregate') items.push({ label: '🔧 Take apart', run: () => disassemble(o) });
    items.push({ label: '📋 Spec card', run: () => el.dispatchEvent(new MouseEvent('dblclick', { bubbles: true })) });
  }
  const ua = userActions(kk);
  if (ua.length) items.push({ sep: true });
  for (const name of ua) items.push({ label: name, user: true, run: () => hint(`★ ran your action “<b>${name}</b>” on ${o.label || o.id} — (round three: user actions bind to voice + scripts)`) });
  items.push({ sep: true });
  items.push({ label: '＋ Add action…', run: () => { const n = prompt('Name the new action for this kind of object:'); if (n && n.trim()) { addUserAction(kk, n.trim()); hint(`★ “<b>${n.trim()}</b>” added — right-click again to see it.`); } } });
  ctx.innerHTML = items.map((it, i) => it.sep ? '<div class="sep"></div>' : `<div class="mi ${it.user ? 'user' : ''}" data-i="${i}">${it.label}</div>`).join('');
  ctx.style.left = Math.min(innerWidth - 210, e.clientX) + 'px';
  ctx.style.top = Math.min(innerHeight - 40 * items.length, e.clientY) + 'px';
  ctx.style.display = 'block';
  ctx.querySelectorAll('.mi').forEach(mi => mi.addEventListener('click', () => { ctx.style.display = 'none'; items[+mi.dataset.i].run(); }));
});
addEventListener('keydown', (e) => { if (e.key === 'Escape') { ctx.style.display = 'none'; peek.style.display = 'none'; } });

window.__desk = { makeAggregate, disassemble, voiceCommand, machines: () => machines, aggregates: () => aggregates, peekContent, userActions };
</script>
</body>
